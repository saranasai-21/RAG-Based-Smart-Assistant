<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Analytics Dashboard - DocMind AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --border-color: #334155;
            --success-color: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { margin: 0; background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card h3 { margin: 0; color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; }
        .card .value { font-size: 2rem; font-weight: bold; margin: 0; }
        .card .trend { color: var(--success-color); font-size: 0.875rem; }

        .chart-placeholder {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Analytics Dashboard</h1>
        <a href="/" class="btn">Back to Assistant</a>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Total Queries</h3>
            <div class="value" id="val-queries">1,248</div>
            <div class="trend">↑ 12% this week</div>
        </div>
        <div class="card">
            <h3>Avg. Confidence Score</h3>
            <div class="value" id="val-conf">87.4%</div>
            <div class="trend">↑ 2.1% from last month</div>
        </div>
        <div class="card">
            <h3>Documents Indexed</h3>
            <div class="value" id="val-docs">0</div>
            <div class="trend">Active in knowledge base</div>
        </div>
        <div class="card">
            <h3>Avg. Response Time</h3>
            <div class="value">1.2s</div>
            <div class="trend">↓ 0.4s (Groq Accelerated)</div>
        </div>
    </div>

    <div class="chart-placeholder">
        [ Chart Widget: Query Volume Over Time ]
    </div>

    <script>
        // Fetch health endpoint to update dynamic stats
        fetch('/api/health')
            .then(res => res.json())
            .then(data => {
                document.getElementById('val-docs').innerText = data.docs;
            })
            .catch(console.error);
    </script>
</body>
</html>
