[project]
name = "rag-based-smart-assistant"
version = "1.0.0"
description = "Advanced multi-document Retrieval-Augmented Generation assistant with FastAPI backend and modern web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "langchain",
    "langchain-community",
    "langchain-groq",
    "pypdf",
    "python-docx",
    "rank-bm25",
    "numpy",
    "python-dotenv",
    "langgraph",
    "langchain-google-genai",
    "chromadb",
    "langchain-chroma",
    "langchain-text-splitters"
]

[tool.setuptools]
packages = ["api", "rag"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults (used by dataclasses field)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
