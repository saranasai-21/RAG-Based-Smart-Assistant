[project]
name = "rag-based-smart-assistant"
version = "1.0.0"
description = "Advanced multi-document Retrieval-Augmented Generation assistant built with Streamlit."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults (used by dataclasses field)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
