[project]
name = "rag-based-smart-assistant"
version = "1.0.0"
description = "Advanced multi-document Retrieval-Augmented Generation assistant built with Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.29.0",
    "python-multipart==0.0.9",
    "langchain==1.3.7",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "langchain-groq==1.1.3",
    "pypdf==6.13.2",
    "pdfplumber==0.11.9",
    "python-docx==1.1.2",
    "rank-bm25==0.2.2",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "python-dotenv==1.2.2"
]
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults (used by dataclasses field)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
